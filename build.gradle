plugins {
    id 'java-library'
    id 'maven-publish'
}
group = 'io.github.raphimc'
version = '1.4.3.1'
description = 'An unofficial pure Java port of libFLAC, supporting FLAC encoding and decoding, metadata editing, and ReplayGain analysis and synthesis.'
allprojects {
    group = 'io.github.raphimc'
    version = '1.4.3.1'
    repositories { mavenCentral() }
    tasks.withType(Jar).configureEach {
        from(rootProject.projectDir) {
            include 'COPYING*'
            into 'META-INF/licenses'
        }
    }
    tasks.withType(Javadoc).configureEach {
        options.addBooleanOption('Xdoclint:all,-missing', true)
    }
}
java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
    withSourcesJar()
    withJavadocJar()
}
tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}
configurations {
    testRuntimeOnly.extendsFrom compileOnly
}
dependencies {
    compileOnly 'org.jcraft:jorbis:0.0.17'
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.3'
}
test { useJUnitPlatform() }
javadoc { options.encoding = 'UTF-8' }
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = 'libflac-java'
                description = project.description
                url = 'https://github.com/RaphiMC/libflac-java'
                licenses {
                    license {
                        name = 'BSD 3-Clause License'
                        url = 'https://opensource.org/licenses/BSD-3-Clause'
                        comments = 'FLAC codec and metadata'
                    }
                    license {
                        name = 'GNU Lesser General Public License v2.1 or later'
                        url = 'https://www.gnu.org/licenses/old-licenses/lgpl-2.1.html'
                        comments = 'ReplayGain analysis and synthesis'
                    }
                }
                developers {
                    developer {
                        id = "RK_01"
                    }
                }
                contributors {
                    contributor {
                        name = 'Josh Coalson'
                        roles = ['libFLAC author']
                    }
                    contributor {
                        name = 'Xiph.Org Foundation'
                        roles = ['libFLAC copyright holder']
                    }
                    contributor {
                        name = 'David Robinson'
                        roles = ['ReplayGain analysis author']
                    }
                    contributor {
                        name = 'Glen Sawyer'
                        roles = ['ReplayGain analysis author']
                    }
                    contributor {
                        name = 'John Edwards'
                        roles = ['WaveGain author (ReplayGain synthesis)']
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/RaphiMC/libflac-java.git'
                    developerConnection = 'scm:git:ssh://git@github.com/RaphiMC/libflac-java.git'
                    url = 'https://github.com/RaphiMC/libflac-java'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'aggregate-publisher'
            url = uri('http://127.0.0.1:8181/aggregate/maven')
            allowInsecureProtocol = true
        }
    }
}
